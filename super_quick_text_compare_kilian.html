<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff2Html</title>
  <link rel="stylesheet" href="dep/diff2html.min.css">
  <link rel="stylesheet" href="dep/darkspark2.css">
  <link rel="stylesheet" href="dep/prism-synthwave84.css">
  <link rel="stylesheet" href="dep/kilian_extra_css.css">
  <style>
    /* apply pixel font to entire page */
    * {
      font-family: 'Monaco', monospace;
      font-size: 16px;
      -webkit-font-smoothing: none;
      -moz-font-smoothing: none;
      font-smoothing: none;
      text-rendering: optimizeLegibility;
    }

    body {
      line-height: 2.5;
      color: #ccc;
      background-color: #170f1b;
    }

    #comparison {
      opacity: 0;
    }

    .big_go_button {
      background-image: linear-gradient(to bottom, #378247, #234321);
      border: none;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    textarea {
      margin: 0;
      padding: 10px;
      background-color: #14191f;
      color: #ffcfcf;
      resize: vertical;
      width: 100%;
      height: 280px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .spanx {
      text-align: center;
      color: #f0f0f0;
      position: fixed;
      bottom: 10px;
      right: 20px;
      opacity: 0.5;
    }

    .textarea-container {
      display: flex;
      flex-direction: row;
    }

    #comparison {
      display: flex;
      flex-direction: row;
    }

    #diff-container {
      padding: 20px;
    }

    .diff2html-code-frame {
      display: flex;
      flex-direction: row;
    }

    .diff2html-code-frame .d2h-file-header {
      background-color: #444;
      padding: 10px;
      border-bottom: 1px solid #555;
    }

    .diff2html-code-frame .d2h-code-line {
      padding: 10px;
    }

    .diff2html-code-frame .d2h-code-line.d2h-added {
      background-color: #0f0;
    }

    .diff2html-code-frame .d2h-code-line.d2h-removed {
      background-color: #f00;
    }

    #diff-containers {
      display: flex;
      flex-direction: row;
    }

    #line-diff-container, #word-diff-container, #char-diff-container {
      padding: 20px;
      margin: 20px;
      border: 1px solid #555;
      border-radius: 10px;
      background-color: #333;
    }

    #line-diff, #word-diff, #char-diff {
      padding: 20px;
      overflow-y: auto;
      max-height: 500px;
    }
    #diff-containers {
      display: flex;
      flex-direction: row;
      width: 100%;
    }

    .textarea-wrapper {
      width: 50%;
      padding: 20px;
      box-sizing: border-box;
    }
    @media (max-width: 800px) {
      .textarea-wrapper {
        width: 100%;
        padding: 10px;
      }
    }
    .textarea-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    * {overflow: none;}
    #diff-containers {
      display: flex;
      flex-direction: row;
      width: 100%;
    }

    #line-diff-container, #word-diff-container, #char-diff-container {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
    }

    @media (max-width: 800px) {
      #diff-containers {
        flex-direction: column;
      }
      #line-diff-container, #word-diff-container, #char-diff-container {
        width: 100%;
        padding: 20px;
      }
    }
    /* Dark Theme */
:root {
  --d2h-dark-bg-color: #0d1117;
  --d2h-dark-border-color: #30363d;
  --d2h-dark-dim-color: #6e7681;
}

/* Light Theme */
:root {
  --d2h-light-bg-color: #fff;
  --d2h-light-border-color: #ddd;
  --d2h-light-dim-color: #ccc;
}

/* Base Styles */
body {
  background-color: var(--d2h-dark-bg-color);
  color: var(--d2h-light-border-color);
  font-family: Menlo, monospace;
  font-size: 16px;
  line-height: 2.5;
  margin: 0;
  padding: 0;
}

textarea {
  font-size: 2em;
  padding: 10px;
  margin: 20px;
  border: 1px #66666699 solid;
  border-radius: 10px;
  background-color: var(--d2h-dark-bg-color);
  color: var(--d2h-light-border-color);
  resize: vertical;
}

/* Diff Container Styles */
#diff-container {
  height: 80%;
}

/* File Wrapper Styles */
.d2h-file-wrapper {
  margin-bottom: 1em;
  background-color: rgba(223, 203, 189, 0.96);
  border-radius: 15px;
}

.d2h-file-side-diff {
  width: 50%;
  background-color: rgba(255, 255, 255, 0.56);
  border-radius: 6px;
}

/* Code Side Line Styles */
.d2h-code-side-line {
  width: 100%;
}

.d2h-code-side-linenumber {
  padding: unset;
}

/* Comparison Styles */
#comparison {
  display: flex;
  flex-direction: row;
  /* min-height: 280px; */
  background-color: rgb(243, 241, 232);
  border-radius: 25px;
}

#comparison div {
  width: 33vw;
  min-height: 400px;
}
  </style>
</head>
<body>
  <span class="spanx">CODE DIFF</span>
  <div class="textarea-container">
    <div class="textarea-wrapper">
      <h2>Old Code</h2>
      <textarea id="text1" autocomplete="off" spellcheck="false">OLD CODE
PASTE HERE
</textarea>
    </div>
    <div class="textarea-wrapper">
      <h2>New Code</h2>
      <textarea id="text2" autocomplete="off" spellcheck="false">NEW CODE
PASTE HERE
</textarea>
    </div>
  </div>
  <button class="big_go_button">GO</button>
  <div id="diff-container"></div>
  <div id="comparison"></div>
  <div id="diff-containers">
    <div id="line-diff-container">
      <h2>Line Level Diff</h2>
      <div id="line-diff"></div>
    </div>
    <div id="word-diff-container">
      <h2>Word Level Diff</h2>
      <div id="word-diff"></div>
    </div>
    <div id="char-diff-container">
      <h2>Char Level Diff</h2>
      <div id="char-diff"></div>
    </div>
  </div>
  <script src="dep/diff2html-ui.min.js" defer></script>
  <script src="dep/diff.min.js" defer></script>
  <script src="dep/prism.min.js" defer></script>
  <script src="dep/hogan.min.js" defer></script>
  <script>
    const text1Element = document.getElementById('text1');
    const text2Element = document.getElementById('text2');
    const diffContainerElement = document.getElementById('diff-container');

    function updateDiff() {
      const text1 = text1Element.value;
      const text2 = text2Element.value;
      const diffInput = `--- a/a.js
+++ b/b.js
@@ -1,5 +1,3 @@
-${text1.replace(/\n/g, '\n-')}
+${text2.replace(/\n/g, '\n+')}`;
      const configuration = {
        drawFileList: false,
        matching: 'lines',
        outputFormat: 'side-by-side',
        highlight: true
      };
      const diff2htmlUi = new Diff2HtmlUI(diffContainerElement, diffInput, configuration);
      diff2htmlUi.draw();
      diff2htmlUi.highlightCode();
    }

    document.querySelector('.big_go_button').addEventListener('click', function () {
      const comparu = document.getElementById('comparison');
      this.style.opacity = 0; 
      comparu.style.opacity = 1; 

      setTimeout(() => {
        this.style.display = 'none'; 
      }, 800);

      text1Element.addEventListener('input', updateDiff);
      text2Element.addEventListener('input', updateDiff);
      updateDiff();

      text1Element.addEventListener('input', compareText);
      text2Element.addEventListener('input', compareText);
      compareText(); 
    });

    function compareText() {
      const text1 = document.getElementById('text1').value.trim();
      const text2 = document.getElementById('text2').value.trim();
      const charDiff = Diff.diffChars(text1, text2);
      const wordDiff = Diff.diffWords(text1, text2);
      const lineDiff = Diff.diffLines(text1, text2);

      function createDiffFragment(diff, id) {
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < diff.length; i++) {
          const node = document.createElement('span');
          node.appendChild(document.createTextNode(diff[i].value));
          if (diff[i].added) {
            node.style.color = 'green';
          } else if (diff[i].removed) {
            node.style.color = 'red';
          }
          node.style.whiteSpace = 'pre';
          fragment.appendChild(node);
          if (diff[i].value.endsWith("\n")) {
            const br = document.createElement('br');
            fragment.appendChild(br);
            fragment.appendChild(document.createTextNode("\n"));
          }
        }
        document.getElementById(id).textContent = '';
        document.getElementById(id).appendChild(fragment);
      }
      createDiffFragment(charDiff, 'char-diff');
      createDiffFragment(wordDiff, 'word-diff');
      createDiffFragment(lineDiff, 'line-diff');
    }
  </script>
</body>
</html>
